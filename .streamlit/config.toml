# Tema del tablero: la paleta de April Collections, para que se reconozca como
# parte del mismo producto y no como una herramienta ajena pegada al lado.
#
# Este archivo SI se versiona. El que no se sube es .streamlit/secrets.toml,
# que es donde irian credenciales — y aqui no hace falta ninguna: el tablero
# lee archivos del repositorio, no la base de datos.

[theme]
base = "light"
primaryColor = "#9e3f52"
backgroundColor = "#fdf8f4"
secondaryBackgroundColor = "#f5dde1"
textColor = "#2a2024"

[server]
headless = true
